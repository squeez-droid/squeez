x-build: &service-build
  context: ../..
  dockerfile: Dockerfile.backend

x-runtime: &runtime
  DATABASE_URL: ${DATABASE_URL}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://squeez.tech}
  PINATA_JWT: ${PINATA_JWT}
  PINATA_API_URL: ${PINATA_API_URL:-https://api.pinata.cloud}
  PINATA_UPLOAD_URL: ${PINATA_UPLOAD_URL:-https://uploads.pinata.cloud/v3/files}
  PINATA_GATEWAY_URL: ${PINATA_GATEWAY_URL:-https://gateway.pinata.cloud/ipfs}
  X_OAUTH_ENABLED: ${X_OAUTH_ENABLED:-false}
  X_CLIENT_ID: ${X_CLIENT_ID}
  X_CLIENT_SECRET: ${X_CLIENT_SECRET}
  X_REDIRECT_URI: ${X_REDIRECT_URI}
  SQUEEZ_ATTESTER_PRIVATE_KEY: ${SQUEEZ_ATTESTER_PRIVATE_KEY}
  X_MAX_ATTESTED_LAUNCHES_PER_24H: ${X_MAX_ATTESTED_LAUNCHES_PER_24H:-3}
  ELYSIUM_CHAIN_ID: ${ELYSIUM_CHAIN_ID:-99801}
  ELYSIUM_RPC: ${ELYSIUM_RPC}
  ELYSIUM_RPC_FALLBACK: ${ELYSIUM_RPC_FALLBACK}
  ELYSIUM_EXPLORER: ${ELYSIUM_EXPLORER}
  ROBINHOOD_CHAIN_ID: ${ROBINHOOD_CHAIN_ID:-46630}
  ROBINHOOD_RPC: ${ROBINHOOD_RPC}
  ROBINHOOD_RPC_FALLBACK: ${ROBINHOOD_RPC_FALLBACK}
  ROBINHOOD_EXPLORER: ${ROBINHOOD_EXPLORER}
  ROBINHOOD_DATABASE_SCHEMA: ${ROBINHOOD_DATABASE_SCHEMA:-robinhood_mainnet}
  INDEXER_MAX_REQUESTS_PER_SECOND: ${INDEXER_MAX_REQUESTS_PER_SECOND:-2}
  INDEXER_LOG_BLOCK_RANGE: ${INDEXER_LOG_BLOCK_RANGE:-10}
  GRADUATION_THRESHOLD_HYPE: ${GRADUATION_THRESHOLD_HYPE}
  VIRTUAL_HYPE_RESERVE: ${VIRTUAL_HYPE_RESERVE}
  VIRTUAL_TOKEN_RESERVE: ${VIRTUAL_TOKEN_RESERVE}
  SNIPER_TAX_START_BPS: ${SNIPER_TAX_START_BPS}
  SNIPER_TAX_DECAY_SECONDS: ${SNIPER_TAX_DECAY_SECONDS}
  MAX_BUY_BPS_PER_TRANSACTION: ${MAX_BUY_BPS_PER_TRANSACTION}
  MAX_WALLET_BPS: ${MAX_WALLET_BPS}
  MAX_WALLET_WINDOW_SECONDS: ${MAX_WALLET_WINDOW_SECONDS}
  LAUNCH_FEE_HYPE: ${LAUNCH_FEE_HYPE}
  ROBINHOOD_GRADUATION_THRESHOLD_HYPE: ${ROBINHOOD_GRADUATION_THRESHOLD_HYPE}
  ROBINHOOD_SNIPER_TAX_START_BPS: ${ROBINHOOD_SNIPER_TAX_START_BPS}
  ROBINHOOD_SNIPER_TAX_DECAY_SECONDS: ${ROBINHOOD_SNIPER_TAX_DECAY_SECONDS}
  ROBINHOOD_MAX_BUY_BPS_PER_TRANSACTION: ${ROBINHOOD_MAX_BUY_BPS_PER_TRANSACTION}
  ROBINHOOD_MAX_WALLET_BPS: ${ROBINHOOD_MAX_WALLET_BPS}
  ROBINHOOD_MAX_WALLET_WINDOW_SECONDS: ${ROBINHOOD_MAX_WALLET_WINDOW_SECONDS}
  ROBINHOOD_LAUNCH_FEE_HYPE: ${ROBINHOOD_LAUNCH_FEE_HYPE}
  HYPEREVM_CHAIN_ID: ${HYPEREVM_CHAIN_ID:-999}
  HYPEREVM_RPC: ${HYPEREVM_RPC}
  HYPEREVM_RPC_FALLBACK: ${HYPEREVM_RPC_FALLBACK}
  HYPEREVM_EXPLORER: ${HYPEREVM_EXPLORER:-https://hyperevmscan.io}
  HYPEREVM_DATABASE_SCHEMA: ${HYPEREVM_DATABASE_SCHEMA:-hyperevm_mainnet}
  HYPEREVM_GRADUATION_THRESHOLD_HYPE: ${HYPEREVM_GRADUATION_THRESHOLD_HYPE}
  HYPEREVM_SNIPER_TAX_START_BPS: ${HYPEREVM_SNIPER_TAX_START_BPS}
  HYPEREVM_SNIPER_TAX_DECAY_SECONDS: ${HYPEREVM_SNIPER_TAX_DECAY_SECONDS}
  HYPEREVM_MAX_BUY_BPS_PER_TRANSACTION: ${HYPEREVM_MAX_BUY_BPS_PER_TRANSACTION}
  HYPEREVM_MAX_WALLET_BPS: ${HYPEREVM_MAX_WALLET_BPS}
  HYPEREVM_MAX_WALLET_WINDOW_SECONDS: ${HYPEREVM_MAX_WALLET_WINDOW_SECONDS}
  HYPEREVM_LAUNCH_FEE_HYPE: ${HYPEREVM_LAUNCH_FEE_HYPE}

x-service: &service
  build: *service-build
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  gateway:
    <<: *service
    environment:
      SQUEEZ_SERVICE: gateway
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://squeez.tech}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-8000000}
      GATEWAY_REQUESTS_PER_MINUTE: ${GATEWAY_REQUESTS_PER_MINUTE:-300}
      ELYSIUM_TESTNET_API_URL: http://api-elysium-testnet:8080
      ELYSIUM_TESTNET_CAPABILITY: ${ELYSIUM_TESTNET_CAPABILITY:-enabled}
      ROBINHOOD_TESTNET_API_URL: http://api-robinhood-testnet:8080
      ROBINHOOD_TESTNET_CAPABILITY: ${ROBINHOOD_TESTNET_CAPABILITY:-enabled}
      ROBINHOOD_MAINNET_API_URL: http://api-robinhood-mainnet:8080
      ROBINHOOD_MAINNET_CAPABILITY: ${ROBINHOOD_MAINNET_CAPABILITY:-read-only}
      HYPEREVM_MAINNET_API_URL: http://api-hyperevm-mainnet:8080
      HYPEREVM_MAINNET_CAPABILITY: ${HYPEREVM_MAINNET_CAPABILITY:-read-only}
      HYPEREVM_TESTNET_CAPABILITY: coming-soon
      ELYSIUM_MAINNET_CAPABILITY: coming-soon
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api-elysium-testnet:
        condition: service_healthy
      api-robinhood-testnet:
        condition: service_healthy
      api-robinhood-mainnet:
        condition: service_healthy
      api-hyperevm-mainnet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  api-elysium-testnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: api
      SQUEEZ_CHAIN: elysium
      SQUEEZ_NETWORK: testnet
      DATABASE_SCHEMA: testnet
      CROSS_CHAIN_DATABASE_SCHEMA: robinhood_testnet
      PORT: 8080
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v1/elysium/testnet/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4

  indexer-elysium-testnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: indexer
      SQUEEZ_CHAIN: elysium
      SQUEEZ_NETWORK: testnet
      DATABASE_SCHEMA: testnet
    depends_on:
      api-elysium-testnet:
        condition: service_started

  api-robinhood-testnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: api
      SQUEEZ_CHAIN: robinhood
      SQUEEZ_NETWORK: testnet
      DATABASE_SCHEMA: robinhood_testnet
      CROSS_CHAIN_DATABASE_SCHEMA: testnet
      PORT: 8080
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v1/robinhood/testnet/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4

  indexer-robinhood-testnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: indexer
      SQUEEZ_CHAIN: robinhood
      SQUEEZ_NETWORK: testnet
      DATABASE_SCHEMA: robinhood_testnet
    depends_on:
      api-robinhood-testnet:
        condition: service_started

  api-robinhood-mainnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: api
      SQUEEZ_CHAIN: robinhood
      SQUEEZ_NETWORK: mainnet
      SQUEEZ_API_CAPABILITY: read-only
      DATABASE_SCHEMA: robinhood_mainnet
      CROSS_CHAIN_DATABASE_SCHEMA: testnet
      PORT: 8080
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v1/robinhood/mainnet/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4

  indexer-robinhood-mainnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: indexer
      SQUEEZ_CHAIN: robinhood
      SQUEEZ_NETWORK: mainnet
      DATABASE_SCHEMA: robinhood_mainnet
      INDEXER_MAX_REQUESTS_PER_SECOND: ${INDEXER_MAX_REQUESTS_PER_SECOND:-2}
      INDEXER_LOG_BLOCK_RANGE: ${INDEXER_LOG_BLOCK_RANGE:-10}
    depends_on:
      api-robinhood-mainnet:
        condition: service_started

  api-hyperevm-mainnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: api
      SQUEEZ_CHAIN: hyperevm
      SQUEEZ_NETWORK: mainnet
      SQUEEZ_API_CAPABILITY: read-only
      DATABASE_SCHEMA: hyperevm_mainnet
      CROSS_CHAIN_DATABASE_SCHEMA: robinhood_mainnet
      PORT: 8080
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v1/hyperevm/mainnet/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4

  indexer-hyperevm-mainnet:
    <<: *service
    environment:
      <<: *runtime
      SQUEEZ_SERVICE: indexer
      SQUEEZ_CHAIN: hyperevm
      SQUEEZ_NETWORK: mainnet
      DATABASE_SCHEMA: hyperevm_mainnet
      INDEXER_MAX_REQUESTS_PER_SECOND: ${HYPEREVM_INDEXER_MAX_REQUESTS_PER_SECOND:-2}
      INDEXER_LOG_BLOCK_RANGE: ${HYPEREVM_INDEXER_LOG_BLOCK_RANGE:-10}
    depends_on:
      api-hyperevm-mainnet:
        condition: service_started
