[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../../node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
]

[rpc_endpoints]
# Points at testnet or mainnet depending on the loaded .env.<network> file
elysium = "${ELYSIUM_RPC}"

[fmt]
line_length = 120
