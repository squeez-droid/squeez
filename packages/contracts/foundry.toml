[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../../node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "write", path = "./deployments" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=../../node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=../../node_modules/@uniswap/v4-periphery/",
  "permit2/=../../node_modules/@uniswap/v4-periphery/lib/permit2/",
  "solmate/=../../node_modules/@uniswap/v4-periphery/lib/permit2/lib/solmate/",
]

[rpc_endpoints]
# Generic endpoint selected by tools/with-env.mjs.
squeez = "${SQUEEZ_RPC}"
# Legacy alias retained for existing Elysium operational commands.
elysium = "${ELYSIUM_RPC}"

[fmt]
line_length = 120

[invariant]
runs = 64
depth = 64
fail_on_revert = false
